[package]
name = "word-image-extractor"
version = "0.3.0"
edition = "2024"

[dependencies]
zip = "2.1.0"
clap = { version = "4.5.4", features = ["derive"] }
anyhow = "1.0.82"
walkdir = "2.5.0"
epub = "2.1.4"
percent-encoding = "2.3"
indicatif = "0.18.3"
image = { version = "0.25", default-features = false, features = [
    "jpeg",
    "png",
    "gif",
    "bmp",
    "tiff",
    "webp",
    "ico",
] }
webp = "0.3"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
