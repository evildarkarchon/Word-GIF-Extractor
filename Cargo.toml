[package]
name = "word-image-extractor"
version = "0.3.0"
edition = "2024"
# The oldest compiler that builds every target, checked by the `msrv` CI job.
# Edition 2024 needs 1.85 and let-chains need 1.88; `zip` 9.6 and `image`
# 0.25.10 also declare 1.88. Raise it when a dependency upgrade does.
rust-version = "1.88"

[dependencies]
# DOCX and EPUB entries are stored or deflated, so only the deflate codec is
# needed. The default features would also compile AES, bzip2, deflate64, LZMA,
# PPMd, xz, zstd and `time`. The major version and features match what `epub`
# asks of `zip`, so the two resolve to one copy and each EPUB's central
# directory is parsed by one implementation.
zip = { version = "9.6.0", default-features = false, features = ["deflate"] }
clap = { version = "4.5.4", features = ["derive"] }
anyhow = "1.0.82"
walkdir = "2.5.0"
epub = "2.1.4"
percent-encoding = "2.3"
indicatif = "0.18.3"
image = { version = "0.25", default-features = false, features = [
    "jpeg",
    "png",
    "gif",
    "bmp",
    "tiff",
    "webp",
    "ico",
] }
webp = "0.3"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
